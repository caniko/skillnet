[flake]
scope = "hooks-only"

[ci]
runner = "ubuntu-24.04"
with_audit = true
with_deny = true
with_docs = true
with_msrv = true
runtime = "nix"
required_gates = [{ id = "harbor-ci", run = "nix develop -c harbor-ci full" }]
step_runners = { cargo-clippy = "ubuntu-24.04", cargo-doc = "ubuntu-24.04", cargo-fmt = "ubuntu-24.04", cargo-package = "ubuntu-24.04", cargo-test = "ubuntu-24.04", nix-check = "ubuntu-24.04", quality-tools = "ubuntu-24.04" }
provider = "actions"
platform = "github"
publish_crates = true

[ci.pages]
repo = "caniko/skillnet"
canonical_domain = "skillnet.tartanoglu.com"
source_branch = "main"
