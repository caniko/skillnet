[flake]
scope = "hooks-only"

[ci]
runner = "ubuntu-24.04"
with_audit = true
with_deny = true
with_docs = true
with_msrv = true
runtime = "nix"
required_gates = [{ id = "harbor-ci", run = "nix develop -c harbor-ci full" }]
step_runners = { cargo-clippy = "ubuntu-24.04", cargo-doc = "ubuntu-24.04", cargo-fmt = "ubuntu-24.04", cargo-package = "ubuntu-24.04", cargo-test = "ubuntu-24.04", nix-check = "ubuntu-24.04", quality-tools = "ubuntu-24.04" }
provider = "actions"
platform = "github"
publish_crates = true
nix_builds = [".#packages.x86_64-linux.skillnet"]
publish_strategy = "members"

[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"
system_runners = { x86_64-linux = "ubuntu-24.04" }

[release.github]
repo = "caniko/skillnet"
target_branch = "trunk"

[release.artifacts]
# Prebuilt cargo-binstall archives: one bundle per system, merged into the
# single release by the generated release workflow.
prebuild_binaries = true
binstall = true
system_runners = { x86_64-linux = "ubuntu-24.04", aarch64-darwin = "macos-15" }
runner = "ubuntu-24.04"
substituters = ["https://attic.candee.baby/canix", "https://cache.nixos.org"]
trusted_public_keys = [
  "canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8=",
  "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=",
]
sign = true

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "skillnet"
token_secret = "ATTIC_TOKEN"

[ci.pages]
repo = "caniko/skillnet"
canonical_domain = "skillnet.tartanoglu.com"
source_branch = "main"
