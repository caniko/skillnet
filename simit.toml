[flake]
scope = "hooks-only"

[ci]
runner = "ubuntu-24.04"
with_audit = true
with_deny = true
with_docs = true
with_msrv = true
runtime = "nix"
step_runners = { cargo-clippy = "codeberg-small", cargo-doc = "codeberg-small", cargo-fmt = "codeberg-tiny", cargo-package = "codeberg-medium", cargo-test = "codeberg-medium", nix-check = "atlas-nix-trusted", quality-tools = "codeberg-small" }
provider = "actions"
platform = "github"
workspace = true

[ci.pages]
repo = "caniko/skillnet"
canonical_domain = "skillnet.tartanoglu.com"
source_branch = "main"
