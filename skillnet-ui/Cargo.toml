[package]
name = "skillnet-ui"
version = "0.7.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.103"
camino = "1.1"
iced = { version = "0.14", default-features = false, features = [
  "tiny-skia",
  "x11",
  "wayland",
  "tokio",
] }
serde_json = "1.0"
skillnet = { path = ".." }
tempfile = "3.13"
